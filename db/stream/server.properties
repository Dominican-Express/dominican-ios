# Un broker de Kafka para la demo (db/STREAMING.md). Lo arranca y lo para
#   ./db/demo/demo.sh kafka-up      (la primera vez descarga Kafka 3.9.1)
#   ./db/demo/demo.sh kafka-down    (borra también los mensajes)
#
# Modo KRaft: el mismo proceso es broker y controlador, sin ZooKeeper.
# Un solo broker, así que cada partición tiene una copia: sirve para enseñar
# topics, particiones, grupos de consumidores y offsets, no la tolerancia a
# fallos de Kafka. Esa ya la enseña TiKV en el clúster (CLUSTER.md).
# log.dirs lo añade demo.sh: los mensajes van fuera del repo.
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@127.0.0.1:9093
listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
advertised.listeners=PLAINTEXT://127.0.0.1:9092
controller.listener.names=CONTROLLER
inter.broker.listener.name=PLAINTEXT
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
# Los topics los crea demo.sh con sus particiones: un nombre mal escrito no
# debe crear un topic nuevo en silencio.
auto.create.topics.enable=false
