# Balanceador delante de los nodos SurrealDB del clúster (ver CLUSTER.md).
# Lo arranca `demo.sh cluster-up`; la app y los clientes hablan con :8100.

global
    maxconn 2000

defaults
    mode http
    timeout connect 2s
    timeout client  30s
    timeout server  30s
    # Un WebSocket (SDK, LIVE SELECT) se queda abierto en el nodo donde se abrió.
    timeout tunnel  1h
    # Reintentar en otro nodo SOLO si no se pudo conectar: la petición aún no ha
    # salido, así que un pago nunca llega dos veces por culpa del balanceador.
    retries 2
    retry-on conn-failure
    option redispatch

frontend surreal
    bind 127.0.0.1:8100
    default_backend surreal_nodes

backend surreal_nodes
    balance roundrobin
    # Comprobación activa: un nodo que no responde sale de la rotación tras 2
    # fallos (unos 2 s) y vuelve tras 2 aciertos. /status y NO /health: /health
    # también mira el almacenamiento, y si TiKV está eligiendo líder los dos
    # nodos fallan a la vez y HAProxy los saca a los dos. Medido: 22 de 40
    # escrituras fallidas con /health, frente a 5 a 7 sin balanceador. Si lo
    # que falla es lo que comparten todos, sacar nodos no arregla nada.
    option httpchk GET /status
    http-check expect status 200
    default-server inter 1s fall 2 rise 2
    # Qué nodo ha atendido cada respuesta (se ve en el vídeo y en `cluster-write`).
    http-response set-header X-Served-By %s
    server A 127.0.0.1:8101 check
    server B 127.0.0.1:8102 check

frontend stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /
    stats refresh 1s
